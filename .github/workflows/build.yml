name: Flutter Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Create Structure and Mock Assets
        run: |
          flutter create --platforms=android --org com.oneminute .
          mkdir -p assets
          # สร้างไฟล์ mp3 เปล่าขนาดเล็กเพื่อให้ build ผ่าน
          echo "ID3" > assets/notification.mp3

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneMinuteTimer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
